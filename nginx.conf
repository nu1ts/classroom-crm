server {
    listen 80;
    server_name localhost;

    # Relative redirects for reverse proxy compatibility
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index reference/index.html;

    # Gzip compression for static files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Root endpoint: automatically redirect to the CRM reference entry point
    location = / {
        return 302 /reference/index.html$is_args$args;
    }

    # Reference application folder
    location /reference/ {
        try_files $uri $uri/ /reference/index.html;
    }

    # Direct mapping for styles if requested without /reference/
    location /css/ {
        alias /usr/share/nginx/html/reference/css/;
        try_files $uri =404;
    }

    # Application source code and ES modules
    location /src/ {
        try_files $uri =404;
    }

    # Healthcheck endpoint for Docker / orchestration
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Fallback to CRM app
    location / {
        try_files $uri $uri/ /reference/index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
