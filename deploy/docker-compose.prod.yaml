services:
  classroom-crm:
    image: ${DOCKER_USERNAME:-nu1ts}/classroom-crm:${IMAGE_TAG:-latest}
    container_name: classroom-crm
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
