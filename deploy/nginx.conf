server {
    listen 80;
    server_name localhost;

    # Relative redirects for reverse proxy compatibility
    absolute_redirect off;
    port_in_redirect off;

    # The whole site is served from reference/ (path-based routing:
    # each route is a subdirectory with its own index.html)
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static files
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # SPA fallback: unknown paths go to the root SPA entry point
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck endpoint for Docker / orchestration
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'healthy\n';
    }

    # HTML не кэшируется: после деплоя клиент всегда получает свежий index.html
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # JS/CSS без ревизии в имени файла — перепроверять при каждом запросе,
    # чтобы обновление бандла не требовало 7 дней
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Неизменяемая статика (картинки, шрифты, иконки)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
