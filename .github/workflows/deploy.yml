name: Deploy Frontend (Docker)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEPLOY_USERNAME: "deployuser"
  TARGET_DIR: "/home/deployuser/classroom-crm"
  DOCKER_IMAGE: "${{ secrets.DOCKER_USERNAME }}/classroom-crm"
  PORT: "8080"

jobs:
  test:
    name: 🧪 Run Playwright E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🎨 Build CSS
        run: npm run build

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🚀 Run Playwright Tests
        run: npm test

      - name: 📊 Upload Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  build-and-deploy:
    name: 🐳 Build and Deploy
    needs: test
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.run_number }}

      - name: 📁 Copy compose file to server
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME || env.DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yaml"
          target: "${{ env.TARGET_DIR }}/"

      - name: 🚀 Deploy to Server (SSH)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME || env.DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ${{ env.TARGET_DIR }}

            echo "🔐 Generating .env file..."
            cat <<EOF > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            IMAGE_TAG=${{ github.run_number }}
            PORT=${{ env.PORT }}
            EOF

            echo "📥 Pulling latest images..."
            docker compose -f docker-compose.prod.yaml pull

            echo "🚀 Starting CRM container..."
            docker compose -f docker-compose.prod.yaml up -d

            echo "🧹 Cleaning up old images..."
            docker image prune -f

      - name: 🛠 Rollback on Failure
        if: failure() && github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.DEPLOY_USERNAME || env.DEPLOY_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "⚠️ Deployment error. Rolling back to running config..."
            cd ${{ env.TARGET_DIR }}
            docker compose -f docker-compose.prod.yaml up -d
